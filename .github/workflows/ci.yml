name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Новый push в ту же ветку отменяет предыдущий прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Отдельно: линтеру не нужна БД, поэтому он стартует сразу и падает раньше тестов.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Версия пиннится: новый релиз линтера иначе внезапно фейлит зелёные PR.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  backend:
    runs-on: ubuntu-latest
    # БД живёт внутри CI и умирает вместе с ней, поэтому секреты не нужны.
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/chain_of_trades?sslmode=disable
      JWT_SECRET: ci-secret-not-for-production-1234567890
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: chain_of_trades
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d chain_of_trades"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go run ./cmd/migrate up

      # gofmt и go vet сюда не дублируются: их закрывает lint.

      # DATABASE_URL задан, поэтому тесты против живой БД не скипаются.
      - run: go test ./... -race

      - run: go test -tags=integration ./internal/exchange/handler -count=1

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Версии пиннятся: другой генератор даст ложный дрифт.
      - name: install generators
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - run: make sqlc swagger

      # git add -A, иначе новые файлы генератора не попадут в диф.
      - name: check generated code is up to date
        run: git add -A && git diff --cached --exit-code
