name: CD

# Push в main — это уже смёрженный PR, на котором CI отработал. Тесты здесь не
# дублируются: за это отвечает branch protection «require CI».
on:
  push:
    branches: [main]

# Без группы два деплоя подряд наехали бы друг на друга на сервере.
concurrency: cd

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push в GHCR встроенным GITHUB_TOKEN, свой PAT не нужен
    steps:
      - uses: actions/checkout@v5

      # Нужен для cache-from/cache-to: стандартный docker build кеш GHA не умеет.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Тег — sha, а не latest: откат это тот же compose up с прошлым IMAGE_TAG.
      - name: build api
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Compose-файлы едут с каждым деплоем. Иначе новый сервис или правка
      # переменной в репозитории молча не доедут до сервера.
      - name: copy compose files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: docker-compose.yml,docker-compose.prod.yml
          target: /opt/chain-of-trades

      # .env на сервер не едет: JWT_SECRET и пароль базы лежат там же, где том с
      # данными, и через GitHub не проходят вовсе.
      - name: deploy
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_TOKEN,IMAGE_TAG
          script: |
            set -e
            cd /opt/chain-of-trades

            # Токен живёт до конца прогона, поэтому долгоживущего PAT на сервере нет.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            compose="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
            
            # Очистить старые контейнеры перед деплоем, чтобы избежать конфликта портов
            $compose down --remove-orphans || true
            docker network prune -f || true
            
            $compose pull
            # --no-build: на сервере не собирается ничего, только запускается.
            # migrate прогоняется сам, api ждёт его через service_completed_successfully.
            $compose up -d --no-build

            docker logout ghcr.io
            # Слои прошлых деплоев иначе копятся до конца диска.
            docker image prune -f
