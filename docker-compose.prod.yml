# Оверлей к docker-compose.yml: те же сервисы, но образы приезжают из GHCR,
# а не собираются на месте. Применяется вместе с базовым файлом:
#   IMAGE_TAG=<sha> docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
#
# build: из базового файла остаётся, но --no-build его не трогает, а pull идёт
# по image, поэтому гасить сборку отдельно не требуется.
#
# pull_policy возвращается к дефолтному missing: в базовом файле стоит build ради
# локального `docker compose up`, а `docker compose pull` такие сервисы пропускает —
# и на сервер приехал бы не тот образ, что собрал CI.
#
# IMAGE_TAG задаёт .github/workflows/cd.yml. Откат — тот же up с прошлым sha.
services:
  migrate:
    image: ghcr.io/sweetlife999/chain-of-trades-avito/api:${IMAGE_TAG}
    pull_policy: missing

  api:
    image: ghcr.io/sweetlife999/chain-of-trades-avito/api:${IMAGE_TAG}
    pull_policy: missing

  web:
    image: ghcr.io/sweetlife999/chain-of-trades-avito/web:${IMAGE_TAG}
    pull_policy: missing

  # Единственное место в проекте, где нужны resource limits. В остальном они были бы
  # страховкой от масштаба, которого у MVP нет, — здесь наоборот: на сервере одно ядро,
  # и инференс без ограничения займёт ровно то, на котором отвечает API.
  ollama:
    cpus: "0.5"
    # Модель ~400 МБ плюс контекст. Лимит не даёт Ollama выесть память под Postgres:
    # из 2 ГБ сервера ей отдаётся ровно этот кусок, а лишнее убивает cgroup, а не OOM
    # killer, выбирающий жертву сам.
    mem_limit: 1g
    environment:
      # Веса выгружаются из RAM сразу после запроса и возвращают память базе. Платим
      # перезагрузкой с диска на следующем обращении — в фоновой задаче это незаметно.
      OLLAMA_KEEP_ALIVE: 30s
      # Ollama считает доступную память по хосту, а не по cgroup, и на 2 ГБ решает,
      # что потянет несколько параллельных слотов. Каждый слот — свой KV-кеш, и вместе
      # они не влезают в mem_limit выше.
      OLLAMA_NUM_PARALLEL: 1
      # Две модели 0.5b, загруженные разом, — 1.19 ГиБ (замерено), то есть весь бюджет
      # и упор в mem_limit. С этим лимитом Ollama выгрузит предыдущую вместо того,
      # чтобы её убил cgroup.
      OLLAMA_MAX_LOADED_MODELS: 1
