      parameters:
      - description: UUID объявления
        example: 8db9f3e2-8a45-4a70-b3d1-167b4f97e121
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Объявление
          schema:
            $ref: '#/definitions/dto.ItemResponse'
        "400":
          description: ID не является UUID
          schema:
            $ref: '#/definitions/dto.ItemError'
        "404":
