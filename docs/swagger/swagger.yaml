          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "409":
          description: 'Обмен закрыт: тред доступен только на чтение'
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Написать в тред обмена
      tags:
      - exchanges
  /exchanges/{id}/messages/read:
    post:
      consumes:
      - application/json
      description: |-
        Двигает отметку участника до указанного сообщения, обнуляя unread_count в
        GET /exchanges. Клиент присылает id последнего сообщения, которое реально показал,
        поэтому сообщение, пришедшее позже, прочитанным не считается.
        Вызов идемпотентен и назад отметку не двигает: повтор, вторая вкладка и id из
        чужого треда ничего не меняют.
      parameters:
      - description: UUID обмена
        in: path
        name: id
        required: true
        type: string
      - description: ID последнего показанного сообщения
        in: body
        name: read
        required: true
        schema:
          $ref: '#/definitions/dto.MarkReadRequest'
      responses:
        "204":
          description: Отметка обновлена
        "400":
          description: ID не является UUID или тело не JSON
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "403":
          description: Пользователь не участвует в обмене
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "404":
          description: Обмен не найден
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Отметить тред прочитанным
      tags:
      - exchanges
  /exchanges/{id}/rating:
    put:
      consumes:
      - application/json
      description: |-
        Ставит оценку участнику, который передал вещь текущему пользователю. Кого
        оценивают, определяет сама цепочка. Повторный запрос переписывает оценку.
        Доступно 14 дней после завершения обмена.
      parameters:
      - description: UUID обмена
        in: path
        name: id
        required: true
        type: string
      - description: Балл от 1 до 5 и необязательный комментарий
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.RatingResponse'
        "400":
          description: Некорректный UUID, тело или балл вне 1..5
          schema:
            $ref: '#/definitions/dto.RatingError'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/dto.RatingError'
        "403":
          description: Пользователь не участвует в обмене
          schema:
            $ref: '#/definitions/dto.RatingError'
        "404":
          description: Обмен не найден
          schema:
            $ref: '#/definitions/dto.RatingError'
        "409":
          description: Обмен не завершён или срок оценки истёк
          schema:
            $ref: '#/definitions/dto.RatingError'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.RatingError'
      security:
      - CookieAuth: []
      summary: Оценить партнёра по обмену
      tags:
      - ratings
  /health:
    get:
      description: Отвечает 200, если процесс поднят. Состояние БД не проверяет.
      produces:
      - application/json
      responses:
        "200":
          description: сервис работает
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Проверка живости сервиса
      tags:
      - system
  /items:
    get:
      description: |-
        Требует cookie `access_token`. Возвращает все объявления текущего пользователя
        любого статуса, от новых к старым. Чужие объявления этим маршрутом не отдаются.
      produces:
      - application/json
      responses:
        "200":
          description: Список объявлений; если их нет, возвращается []
          schema:
            items:
              $ref: '#/definitions/dto.ItemResponse'
            type: array
        "401":
          description: Нет или истекла cookie access_token
          schema:
            $ref: '#/definitions/dto.ItemError'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.ItemError'
      security:
      - CookieAuth: []
      summary: Получить свои объявления
      tags:
      - items
    post:
      consumes:
      - application/json
      description: |-
        Требует cookie `access_token`. Владелец берётся из токена, а не из тела запроса.
        Нужна хотя бы одна фотография (ссылкой) и хотя бы одна желаемая категория —
        без них объявление не участвует в подборе обменов. Список категорий: GET /categories.
      parameters:
      - description: Данные объявления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateItemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Создано, ссылка на объявление в заголовке Location
          schema:
            $ref: '#/definitions/dto.ItemResponse'
        "400":
          description: Некорректное тело запроса, нет фото или желаний, неизвестная
            категория
          schema:
            $ref: '#/definitions/dto.ItemError'
        "401":
          description: Нет или истекла cookie access_token
          schema:
            $ref: '#/definitions/dto.ItemError'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.ItemError'
      security:
      - CookieAuth: []
      summary: Создать объявление
      tags:
      - items
  /items/{id}:
    delete:
      description: |-
        Требует cookie `access_token`, удалять можно только свои объявления. Вещь, уже занятую
        в незавершённом обмене, удалить нельзя: иначе участник остался бы без обещанного предмета.
      parameters:
      - description: UUID объявления
        example: 8db9f3e2-8a45-4a70-b3d1-167b4f97e121
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Удалено
        "400":
          description: ID не является UUID
          schema:
            $ref: '#/definitions/dto.ItemError'
        "401":
          description: Нет или истекла cookie access_token
          schema:
            $ref: '#/definitions/dto.ItemError'
        "403":
          description: Объявление принадлежит другому пользователю
          schema:
            $ref: '#/definitions/dto.ItemError'
        "404":
          description: Объявление не найдено
          schema:
            $ref: '#/definitions/dto.ItemError'
        "409":
          description: Вещь участвует в незавершённом обмене
          schema:
            $ref: '#/definitions/dto.ItemError'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.ItemError'
      security:
      - CookieAuth: []
      summary: Удалить своё объявление
      tags:
      - items
    get:
      description: 'Публичная карточка вещи: фотографии, желаемые категории и статус.
        Аутентификация не нужна.'
      parameters:
      - description: UUID объявления
        example: 8db9f3e2-8a45-4a70-b3d1-167b4f97e121
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Объявление
          schema:
            $ref: '#/definitions/dto.ItemResponse'
        "400":
          description: ID не является UUID
          schema:
            $ref: '#/definitions/dto.ItemError'
        "404":
          description: Объявление не найдено
          schema:
            $ref: '#/definitions/dto.ItemError'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.ItemError'
      summary: Получить объявление по ID
      tags:
      - items
    patch:
      consumes:
      - application/json
      description: |-
        Требует cookie `access_token`, менять можно только свои объявления. Достаточно одного поля.
        `photo_urls` и `wants` заменяются целиком: чтобы добавить фотографию, пришлите старые
        ссылки вместе с новой. Пустой список запрещён — у объявления всегда есть хотя бы одно фото.
      parameters:
      - description: UUID объявления
        example: 8db9f3e2-8a45-4a70-b3d1-167b4f97e121
        in: path
        name: id
        required: true
        type: string
      - description: Поля, которые нужно изменить
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Обновлённое объявление
          schema:
            $ref: '#/definitions/dto.ItemResponse'
        "400":
          description: Некорректное тело, пустой список фото или желаний, неизвестная
            категория
          schema:
            $ref: '#/definitions/dto.ItemError'
        "401":
          description: Нет или истекла cookie access_token
          schema:
            $ref: '#/definitions/dto.ItemError'
        "403":
          description: Объявление принадлежит другому пользователю
          schema:
            $ref: '#/definitions/dto.ItemError'
        "404":
          description: Объявление не найдено
          schema:
            $ref: '#/definitions/dto.ItemError'
        "409":
          description: Нельзя изменить условия объявления в незавершённом обмене
          schema:
            $ref: '#/definitions/dto.ItemError'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.ItemError'
      security:
      - CookieAuth: []
      summary: Изменить своё объявление
      tags:
      - items
  /items/{id}/pickup:
    delete:
      description: |-
        Возвращает вещь домой. Пока вещь занята в незавершённом обмене, забрать её
        нельзя: остальные участники рассчитывают на то, что она лежит на месте.
        Идемпотентен: у вещи без отметки забирать нечего.
      parameters:
      - description: UUID объявления
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Вещь снова дома
        "400":
          description: ID не является UUID
          schema:
            $ref: '#/definitions/dto.ItemError'
        "401":
          description: Нет или истекла cookie access_token
          schema:
            $ref: '#/definitions/dto.ItemError'
        "403":
          description: Объявление принадлежит другому пользователю
          schema:
            $ref: '#/definitions/dto.ItemError'
        "404":
          description: Объявление не найдено
          schema:
            $ref: '#/definitions/dto.ItemError'
        "409":
          description: Вещь участвует в незавершённом обмене
          schema:
            $ref: '#/definitions/dto.ItemError'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.ItemError'
      security:
      - CookieAuth: []
      summary: Забрать вещь из пункта выдачи
      tags:
      - items
    post:
      consumes:
      - application/json
      description: |-
        Отмечает, что вещь лежит в указанном ПВЗ. Отнести можно и вещь, которая ни в
        каком обмене не участвует — к моменту сборки цепочки она уже будет на месте.
        Когда в пунктах окажутся все вещи подтверждённого обмена, он переходит в доставку.
        Список пунктов: GET /pickup-points.
      parameters:
      - description: UUID объявления
        in: path
        name: id
        required: true
        type: string
      - description: Пункт выдачи
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SetPickupPointRequest'
      responses:
        "204":
          description: Вещь отмечена как сданная в пункт
        "400":
          description: ID не UUID, тело не JSON или такого пункта нет
          schema:
            $ref: '#/definitions/dto.ItemError'
        "401":
          description: Нет или истекла cookie access_token
          schema:
            $ref: '#/definitions/dto.ItemError'
        "403":
          description: Объявление принадлежит другому пользователю
          schema:
            $ref: '#/definitions/dto.ItemError'
        "404":
          description: Объявление не найдено
          schema:
            $ref: '#/definitions/dto.ItemError'
        "409":
          description: Вещь уже обменяна или снята с публикации
          schema:
            $ref: '#/definitions/dto.ItemError'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.ItemError'
      security:
      - CookieAuth: []
      summary: Отнести вещь в пункт выдачи
      tags:
      - items
  /items/{id}/search:
    delete:
      description: |-
        Переводит своё объявление из `available` в `withdrawn`. Все ещё не подтверждённые
        предложения с этой вещью отменяются, а подтверждённый обмен блокирует операцию.
        Повторный вызов безопасен и возвращает ту же карточку.
      parameters:
      - description: UUID объявления
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Объявление больше не участвует в поиске
          schema:
            $ref: '#/definitions/dto.ItemResponse'
        "400":
          description: ID не является UUID
          schema:
            $ref: '#/definitions/dto.ItemError'
        "401":
          description: Нет или истекла cookie access_token
          schema:
            $ref: '#/definitions/dto.ItemError'
        "403":
          description: Объявление принадлежит другому пользователю
          schema:
            $ref: '#/definitions/dto.ItemError'
        "404":
          description: Объявление не найдено
          schema:
            $ref: '#/definitions/dto.ItemError'
        "409":
          description: Объявление занято в подтверждённом обмене или уже обменяно
          schema:
            $ref: '#/definitions/dto.ItemError'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.ItemError'
      security:
      - CookieAuth: []
      summary: Снять объявление с поиска
      tags:
      - items
    put:
      description: |-
        Переводит своё снятое объявление из `withdrawn` в `available` и запускает
        новый автоматический подбор. Повторный вызов безопасен и возвращает ту же карточку.
      parameters:
      - description: UUID объявления
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Объявление снова участвует в поиске
          schema:
            $ref: '#/definitions/dto.ItemResponse'
        "400":
          description: ID не является UUID
          schema:
            $ref: '#/definitions/dto.ItemError'
        "401":
          description: Нет или истекла cookie access_token
          schema:
            $ref: '#/definitions/dto.ItemError'
        "403":
          description: Объявление принадлежит другому пользователю
          schema:
            $ref: '#/definitions/dto.ItemError'
        "404":
          description: Объявление не найдено
          schema:
            $ref: '#/definitions/dto.ItemError'
        "409":
          description: Статус объявления не позволяет вернуть его в поиск
          schema:
            $ref: '#/definitions/dto.ItemError'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.ItemError'
      security:
      - CookieAuth: []
      summary: Вернуть объявление в поиск
      tags:
      - items
  /notifications:
