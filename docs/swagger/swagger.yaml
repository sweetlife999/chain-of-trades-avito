            $ref: '#/definitions/dto.PickupPointError'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/dto.PickupPointError'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.PickupPointError'
      security:
      - CookieAuth: []
      summary: Получить список ПВЗ
      tags:
      - pickup-points
  /pickup-points/{id}:
    get:
      description: Доступно любому авторизованному пользователю — по той же причине,
        что и список.
      parameters:
      - description: UUID ПВЗ
        in: path
        name: id
        required: true
