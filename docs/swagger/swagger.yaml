info:
  contact: {}
  description: |-
    HTTP API сервиса многостороннего обмена вещами: профили пользователей, вход по JWT
    и объявления о вещах, которые владелец готов обменять.

    Защищённые маршруты читают HttpOnly cookie `access_token` — они помечены замком.
    Кнопки «Authorize» здесь нет и не нужно: выполните `POST /auth/login` прямо из этой
    страницы — браузер сохранит cookie и будет отправлять её со всеми следующими
    запросами сам. JavaScript до неё не дотянется, поэтому вписать её руками нельзя.
  title: Цепочка обмена — API
  version: 0.1.0
paths:
  /admin/audit-log:
    get:
      description: Возвращает журнал действий с фильтрами по администратору, действию
        и диапазону дат RFC3339.
      parameters:
      - description: UUID администратора
        in: query
        name: admin_id
        type: string
      - description: Тип действия
        in: query
        name: action
        type: string
      - description: Начало периода RFC3339
        in: query
        name: from
        type: string
      - description: Конец периода RFC3339
        in: query
        name: to
        type: string
      - default: 20
        description: Размер страницы (1-100)
        in: query
        name: limit
        type: integer
      - default: 0
        description: Смещение
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_adminaudit_dto.PageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_adminaudit_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_adminaudit_dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_adminaudit_dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: История действий администраторов
      tags:
      - admin-audit
  /admin/dashboard:
    get:
      description: Возвращает количество пользователей, ПВЗ, объявлений и обменов
        с разбивкой по статусам.
      produces:
      - application/json
      responses:
        "200":
          description: Статистика админки
          schema:
            $ref: '#/definitions/dto.DashboardResponse'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/dto.DashboardError'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/dto.DashboardError'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.DashboardError'
      security:
      - CookieAuth: []
      summary: Статистика для главной страницы админки
      tags:
      - admin dashboard
  /admin/exchanges:
    get:
      description: Доступно только администратору. Возвращает очередь обменов нужного
        этапа вместе с ID, участниками и вещами.
      parameters:
      - description: Статус обмена
        enum:
