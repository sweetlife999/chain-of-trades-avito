      produces:
      - application/json
      responses:
        "200":
          description: ПВЗ
          schema:
            $ref: '#/definitions/dto.PickupPointResponse'
        "400":
          description: Некорректный UUID
          schema:
            $ref: '#/definitions/dto.PickupPointError'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/dto.PickupPointError'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/dto.PickupPointError'
        "404":
          description: ПВЗ не найден
          schema:
            $ref: '#/definitions/dto.PickupPointError'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.PickupPointError'
      security:
      - CookieAuth: []
      summary: Получить ПВЗ по ID
      tags:
      - pickup-points
  /reports:
    post:
      consumes:
      - application/json
      description: |-
        Принимает жалобу на сообщение треда обмена. Пожаловаться можно только на чужое
        сообщение участника в обмене, где жалобщик сам участвует, и только один раз.
        На события обмена (подтверждение, отмена и прочие) жаловаться нельзя: их пишет сервис.
        Жалоба попадает в очередь модерации со статусом open и ни на что в подборе не влияет.
      parameters:
      - description: Сообщение, причина и необязательный комментарий
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateReportRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Жалоба принята
          schema:
            $ref: '#/definitions/dto.ReportResponse'
        "400":
          description: Некорректное тело, неизвестная причина, длинный комментарий
            или жалоба на событие обмена
          schema:
            $ref: '#/definitions/dto.ReportError'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/dto.ReportError'
        "403":
          description: Не участник обмена или жалоба на собственное сообщение
          schema:
            $ref: '#/definitions/dto.ReportError'
        "404":
          description: Сообщение не найдено
          schema:
            $ref: '#/definitions/dto.ReportError'
        "409":
          description: Пользователь уже жаловался на это сообщение
          schema:
            $ref: '#/definitions/dto.ReportError'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.ReportError'
      security:
      - CookieAuth: []
      summary: Пожаловаться на сообщение
      tags:
      - reports
  /support/threads:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ThreadResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_support_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_support_dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Мои обращения в поддержку
      tags:
      - support
    post:
      consumes:
      - application/json
      description: Создаёт отдельный от обменов диалог. Одновременно разрешено одно
        активное обращение.
      parameters:
      - description: Тема и первое сообщение
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateThreadRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.ThreadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_support_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_support_dto.ErrorResponse'
        "409":
          description: Уже есть активное обращение
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_support_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_support_dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Создать обращение в поддержку
      tags:
      - support
  /support/threads/{id}/close:
    post:
      parameters:
      - description: UUID обращения
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ThreadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_support_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_support_dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_support_dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_support_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_support_dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Закрыть обращение
      tags:
      - support
  /support/threads/{id}/messages:
    get:
      parameters:
      - description: UUID обращения
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ThreadMessagesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_support_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_support_dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_support_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_support_dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Переписка с поддержкой
      tags:
      - support
    post:
      consumes:
      - application/json
      parameters:
      - description: UUID обращения
        in: path
        name: id
        required: true
        type: string
      - description: Текст сообщения
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_support_dto.CreateMessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_support_dto.MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_support_dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_support_dto.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_support_dto.ErrorResponse'
        "409":
          description: Обращение закрыто
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_support_dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_support_dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Написать в поддержку
      tags:
      - support
  /users:
    post:
      consumes:
      - application/json
      description: 'Регистрация: nickname 3–32 символа, пароль 8–72 байта. Пароль
        хранится bcrypt-хешем и в ответе не возвращается.'
      parameters:
      - description: Данные нового пользователя
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Создан, ссылка на профиль в заголовке Location
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Некорректное тело запроса или нарушены ограничения полей
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
        "409":
          description: Nickname уже занят
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
      summary: Создать пользователя
      tags:
      - users
  /users/{id}:
    get:
      description: 'Публичный профиль: рейтинг и счётчики сделок. Аутентификация не
        нужна.'
      parameters:
      - description: UUID пользователя
        example: 8db9f3e2-8a45-4a70-b3d1-167b4f97e121
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Профиль пользователя
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: ID не является UUID
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
      summary: Получить пользователя по ID
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Требует cookie `access_token` (получить через POST /auth/login).
        Менять можно только собственный профиль. Достаточно одного поля, остальные
        останутся прежними.
      parameters:
      - description: UUID пользователя
        example: 8db9f3e2-8a45-4a70-b3d1-167b4f97e121
        in: path
        name: id
        required: true
        type: string
      - description: Поля, которые нужно изменить
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Обновлённый профиль
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Некорректное тело запроса, не передано ни одного поля или ID
            не UUID
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
        "401":
          description: Нет или истекла cookie access_token
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
        "403":
          description: Попытка изменить чужой профиль
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
        "409":
          description: Nickname уже занят
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Обновить свой профиль
      tags:
      - users
  /users/{id}/ratings:
    get:
      description: |-
        Возвращает оценки, полученные пользователем, от новых к старым. Отзывы
        анонимны: автор не возвращается. Общее число оценок лежит в профиле.
      parameters:
      - description: UUID пользователя
        in: path
        name: id
        required: true
        type: string
      - default: 20
        description: Размер страницы, от 1 до 100
        in: query
        name: limit
        type: integer
      - default: 0
        description: Смещение, начиная с 0
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.RatingsPageResponse'
        "400":
          description: Некорректный UUID или параметры страницы
          schema:
            $ref: '#/definitions/dto.RatingError'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.RatingError'
      summary: Получить отзывы о пользователе
      tags:
      - ratings
  /users/me/blocks:
    get:
      description: Возвращает личный список блокировок текущего пользователя. Заблокированные
        пользователи об этом не уведомляются.
      produces:
      - application/json
      responses:
        "200":
          description: Список блокировок; если он пуст, возвращается []
          schema:
            items:
              $ref: '#/definitions/dto.BlockedUserResponse'
            type: array
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Получить список заблокированных пользователей
      tags:
      - users
  /users/me/blocks/{user_id}:
    delete:
      description: Разрешает попадание пользователя в новые совместные обмены. Существующие
        обмены не изменяются.
      parameters:
      - description: UUID разблокируемого пользователя
        in: path
        name: user_id
        required: true
        type: string
      responses:
        "204":
          description: Пользователь разблокирован
        "400":
          description: ID не является UUID или пользователь указывает себя
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Разблокировать пользователя
      tags:
      - users
    post:
      description: Исключает пользователя из будущих совместных обменов и отменяет
        общие неподтверждённые предложения. Повторный запрос безопасен.
      parameters:
      - description: UUID блокируемого пользователя
        in: path
        name: user_id
        required: true
        type: string
      responses:
        "204":
          description: Пользователь заблокирован
        "400":
          description: ID не является UUID или пользователь блокирует себя
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
        "404":
          description: Блокируемый пользователь не найден
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Заблокировать пользователя
      tags:
      - users
securityDefinitions:
  CookieAuth:
    description: HttpOnly cookie, которую ставит POST /auth/login.
    in: cookie
    name: access_token
    type: apiKey
swagger: "2.0"
