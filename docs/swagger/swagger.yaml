            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_notification_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_notification_dto.ErrorResponse'
      security:
      - CookieAuth: []
