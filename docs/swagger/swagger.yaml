basePath: /
definitions:
  dto.AuthenticatedUserResponse:
    properties:
      created_at:
        type: string
      deals_broken:
        type: integer
      deals_completed:
        type: integer
      description:
        type: string
      id:
        type: string
      is_admin:
        type: boolean
      nickname:
        type: string
      photo_url:
        type: string
      rating:
        type: number
      updated_at:
        type: string
    type: object
  dto.BlockedUserResponse:
    properties:
      blocked_at:
        type: string
      id:
        type: string
      nickname:
        type: string
      photo_url:
        type: string
    type: object
  dto.CreateItemRequest:
    properties:
      category:
        example: bikes
        type: string
      description:
        example: Почти новый, катался год
        type: string
      photo_urls:
        example:
        - https://example.com/bike-1.jpg
        - https://example.com/bike-2.jpg
        items:
          type: string
        type: array
      title:
        example: Велосипед
        type: string
      wants:
        example:
        - consoles
        - phones
        items:
          type: string
        type: array
    type: object
  dto.CreateMessageRequest:
    properties:
      body:
        example: Могу привезти в субботу к метро, удобно?
        maxLength: 2000
        minLength: 1
        type: string
    required:
    - body
    type: object
  dto.CreatePickupPointRequest:
    properties:
      address:
        example: Казань, улица Ленина, 10
        type: string
      name:
        example: ПВЗ на Ленина
        type: string
    type: object
  dto.CreateReportRequest:
    properties:
      comment:
        example: переходит на личности
        type: string
      message_id:
        example: 3f2a1b4c-5d6e-4f70-8a91-b2c3d4e5f607
        type: string
      reason:
        example: abuse
        type: string
    type: object
  dto.CreateUserRequest:
    properties:
      description:
        type: string
      nickname:
        type: string
      password:
        type: string
      photo_url:
        type: string
    type: object
  dto.DashboardError:
    properties:
      error:
        type: string
    type: object
  dto.DashboardResponse:
    properties:
      exchanges:
        $ref: '#/definitions/dto.ExchangeStatisticsResponse'
      items:
        $ref: '#/definitions/dto.ItemStatisticsResponse'
      pickup_points_total:
        type: integer
      users_total:
        type: integer
    type: object
  dto.ExchangeStatisticsResponse:
    properties:
      cancelled:
        type: integer
      completed:
        type: integer
      confirmed:
        type: integer
      proposed:
        type: integer
      total:
        type: integer
    type: object
  dto.ItemError:
    properties:
      error:
        type: string
    type: object
  dto.ItemResponse:
    properties:
      category:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      owner_id:
        type: string
      photo_urls:
        items:
          type: string
        type: array
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
      wants:
        items:
          type: string
        type: array
    type: object
  dto.ItemStatisticsResponse:
    properties:
      available:
        type: integer
      reserved:
        type: integer
      total:
        type: integer
      traded:
        type: integer
      withdrawn:
        type: integer
    type: object
  dto.ListResponse:
    properties:
      exchanges:
        items:
          $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_adminexchange_dto.ExchangeResponse'
        type: array
      pagination:
        $ref: '#/definitions/dto.PaginationResponse'
    type: object
  dto.LoginRequest:
    properties:
      nickname:
        type: string
      password:
        type: string
    type: object
  dto.MarkReadRequest:
    properties:
      last_message_id:
        example: 3f7c1b62-6f0f-4a2b-8f0e-2f2b9a1c7d10
        type: string
    type: object
  dto.MessageResponse:
    properties:
      author:
        allOf:
        - $ref: '#/definitions/dto.ParticipantUserResponse'
        description: Пуст у событий, которые принадлежат всему обмену, а не участнику.
        x-nullable: true
      body:
        description: Заполнен только у kind = text.
        type: string
        x-nullable: true
      created_at:
        type: string
      id:
        type: string
      kind:
        enum:
        - text
        - participant_accepted
        - participant_declined
        - participant_completed
        - exchange_confirmed
        - exchange_completed
        - exchange_superseded
        type: string
    type: object
  dto.PaginationResponse:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  dto.ParticipantItemResponse:
    properties:
      category:
        $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.CategoryResponse'
      description:
        type: string
      id:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  dto.ParticipantResponse:
    properties:
      completion_confirmed_at:
        type: string
      decided_at:
        type: string
      gives_item:
        $ref: '#/definitions/dto.ParticipantItemResponse'
      position:
        type: integer
      receives_item:
        $ref: '#/definitions/dto.ParticipantItemResponse'
      status:
        type: string
      user:
        $ref: '#/definitions/dto.ParticipantUserResponse'
    type: object
  dto.ParticipantUserResponse:
    properties:
      id:
        type: string
      nickname:
        type: string
      photo_url:
        type: string
    type: object
  dto.PickupPointError:
    properties:
      error:
        type: string
    type: object
  dto.PickupPointResponse:
    properties:
      address:
        type: string
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
    type: object
  dto.ReportError:
    properties:
      error:
        type: string
    type: object
  dto.ReportResponse:
    properties:
      comment:
        type: string
      created_at:
        type: string
      id:
        type: string
      message_id:
        type: string
      reason:
        type: string
      status:
        type: string
    type: object
  dto.UpdateItemRequest:
    properties:
      category:
        example: bikes
        type: string
      description:
        example: Добавил фото рамы
        type: string
      photo_urls:
        example:
        - https://example.com/bike-1.jpg
        - https://example.com/bike-3.jpg
        items:
          type: string
        type: array
      title:
        example: Велосипед городской
        type: string
      wants:
        example:
        - consoles
        items:
          type: string
        type: array
    type: object
  dto.UpdatePickupPointRequest:
    properties:
      address:
        example: Казань, улица Ленина, 12
        type: string
      name:
        example: ПВЗ на Ленина
        type: string
    type: object
  dto.UpdateUserRequest:
    properties:
      description:
        type: string
      nickname:
        type: string
      photo_url:
        type: string
    type: object
  dto.UserResponse:
    properties:
      created_at:
        type: string
      deals_broken:
        type: integer
      deals_completed:
        type: integer
      description:
        type: string
      id:
        type: string
      nickname:
        type: string
      photo_url:
        type: string
      rating:
        type: number
      updated_at:
        type: string
    type: object
  github_com_sweetlife999_chain-of-trades-avito_internal_adminexchange_dto.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  github_com_sweetlife999_chain-of-trades-avito_internal_adminexchange_dto.ExchangeResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      participants:
        items:
          $ref: '#/definitions/dto.ParticipantResponse'
        type: array
      status:
        enum:
        - proposed
        - confirmed
        type: string
      updated_at:
        type: string
    type: object
  github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.CategoryResponse:
    properties:
      name:
        type: string
      slug:
        type: string
    type: object
  github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ExchangeResponse:
    properties:
      closed_at:
        type: string
      created_at:
        type: string
      id:
        type: string
      participants:
        items:
          $ref: '#/definitions/dto.ParticipantResponse'
        type: array
      status:
        type: string
      unread_count:
        type: integer
      updated_at:
        type: string
    type: object
  github_com_sweetlife999_chain-of-trades-avito_internal_item_dto.CategoryResponse:
    properties:
      name:
        example: Велосипеды и транспорт
        type: string
      slug:
        example: bikes
        type: string
    type: object
  github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse:
    properties:
      error:
        type: string
    type: object
info:
  contact: {}
  description: |-
    HTTP API сервиса многостороннего обмена вещами: профили пользователей, вход по JWT
    и объявления о вещах, которые владелец готов обменять.

    Защищённые маршруты читают HttpOnly cookie `access_token` — они помечены замком.
    Кнопки «Authorize» здесь нет и не нужно: выполните `POST /auth/login` прямо из этой
    страницы — браузер сохранит cookie и будет отправлять её со всеми следующими
    запросами сам. JavaScript до неё не дотянется, поэтому вписать её руками нельзя.
  title: Цепочка обмена — API
  version: 0.1.0
paths:
  /admin/dashboard:
    get:
      description: Возвращает количество пользователей, ПВЗ, объявлений и обменов
        с разбивкой по статусам.
      produces:
      - application/json
      responses:
        "200":
          description: Статистика админки
          schema:
            $ref: '#/definitions/dto.DashboardResponse'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/dto.DashboardError'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/dto.DashboardError'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.DashboardError'
      security:
      - CookieAuth: []
      summary: Статистика для главной страницы админки
      tags:
      - admin dashboard
  /admin/exchanges/{id}/cancel:
    post:
      description: Закрывает proposed или confirmed обмен. Для confirmed освобождает
        объявления и запускает повторный поиск. Решения участников и их статистика
        не изменяются.
      parameters:
      - description: UUID обмена
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Обмен отменён
        "400":
          description: ID не является UUID
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "404":
          description: Обмен не найден
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "409":
          description: Обмен уже завершён или отменён либо объявления находятся в
            несовместимом состоянии
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Принудительно отменить обмен
      tags:
      - admin
  /admin/pickup-points:
    get:
      description: Доступно только администратору. Возвращает ПВЗ от новых к старым.
      produces:
      - application/json
      responses:
        "200":
          description: Список ПВЗ
          schema:
            items:
              $ref: '#/definitions/dto.PickupPointResponse'
            type: array
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/dto.PickupPointError'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/dto.PickupPointError'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.PickupPointError'
      security:
      - CookieAuth: []
      summary: Получить список ПВЗ
      tags:
      - admin pickup-points
    post:
      consumes:
      - application/json
      description: Доступно только администратору.
      parameters:
      - description: Данные ПВЗ
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreatePickupPointRequest'
      produces:
      - application/json
      responses:
        "201":
          description: ПВЗ создан
          schema:
            $ref: '#/definitions/dto.PickupPointResponse'
        "400":
          description: Некорректные данные
          schema:
            $ref: '#/definitions/dto.PickupPointError'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/dto.PickupPointError'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/dto.PickupPointError'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.PickupPointError'
      security:
      - CookieAuth: []
      summary: Создать ПВЗ
      tags:
      - admin pickup-points
  /admin/pickup-points/{id}:
    delete:
      description: Доступно только администратору. ПВЗ, который используется объявлениями,
        удалить нельзя.
      parameters:
      - description: UUID ПВЗ
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: ПВЗ удалён
        "400":
          description: Некорректный UUID
          schema:
            $ref: '#/definitions/dto.PickupPointError'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/dto.PickupPointError'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/dto.PickupPointError'
        "404":
          description: ПВЗ не найден
          schema:
            $ref: '#/definitions/dto.PickupPointError'
        "409":
          description: ПВЗ используется объявлениями
          schema:
            $ref: '#/definitions/dto.PickupPointError'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.PickupPointError'
      security:
      - CookieAuth: []
      summary: Удалить ПВЗ
      tags:
      - admin pickup-points
    get:
      description: Доступно только администратору.
      parameters:
      - description: UUID ПВЗ
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: ПВЗ
          schema:
            $ref: '#/definitions/dto.PickupPointResponse'
        "400":
          description: Некорректный UUID
          schema:
            $ref: '#/definitions/dto.PickupPointError'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/dto.PickupPointError'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/dto.PickupPointError'
        "404":
          description: ПВЗ не найден
          schema:
            $ref: '#/definitions/dto.PickupPointError'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.PickupPointError'
      security:
      - CookieAuth: []
      summary: Получить ПВЗ по ID
      tags:
      - admin pickup-points
    patch:
      consumes:
      - application/json
      description: Доступно только администратору. Достаточно передать одно поле.
      parameters:
      - description: UUID ПВЗ
        in: path
        name: id
        required: true
        type: string
      - description: Изменяемые поля
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdatePickupPointRequest'
      produces:
      - application/json
      responses:
        "200":
          description: ПВЗ обновлён
          schema:
            $ref: '#/definitions/dto.PickupPointResponse'
        "400":
          description: Некорректные данные или UUID
          schema:
            $ref: '#/definitions/dto.PickupPointError'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/dto.PickupPointError'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/dto.PickupPointError'
        "404":
          description: ПВЗ не найден
          schema:
            $ref: '#/definitions/dto.PickupPointError'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.PickupPointError'
      security:
      - CookieAuth: []
      summary: Изменить ПВЗ
      tags:
      - admin pickup-points
  /admin/users/{user_id}/exchanges:
    get:
      description: Доступно только администратору. Возвращает proposed и confirmed
        обмены пользователя вместе с участниками и вещами.
      parameters:
      - description: UUID пользователя
        in: path
        name: user_id
        required: true
        type: string
      - default: 20
        description: Размер страницы (1–100)
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Смещение от начала списка
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Активные обмены пользователя
          schema:
            $ref: '#/definitions/dto.ListResponse'
        "400":
          description: Некорректный UUID или пагинация
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_adminexchange_dto.ErrorResponse'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_adminexchange_dto.ErrorResponse'
        "403":
          description: Недостаточно прав
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_adminexchange_dto.ErrorResponse'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_adminexchange_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_adminexchange_dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Получить активные обмены пользователя
      tags:
      - admin exchanges
  /auth/login:
    post:
      consumes:
      - application/json
      description: Проверяет nickname и password, кладёт JWT на 12 часов в HttpOnly
        cookie `access_token`. Из Swagger UI cookie сохранится в браузере, дальше
        защищённые запросы уйдут с ней автоматически.
      parameters:
      - description: Учётные данные
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Вошедший пользователь и его роль, cookie в заголовке Set-Cookie
          schema:
            $ref: '#/definitions/dto.AuthenticatedUserResponse'
        "400":
          description: Некорректное тело запроса
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
        "401":
          description: Неверный nickname или пароль
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
      summary: Вход
      tags:
      - auth
  /auth/logout:
    post:
      description: Удаляет cookie `access_token`. Сам JWT остаётся валидным до истечения
        срока — серверного списка отзыва нет.
      responses:
        "204":
          description: Cookie удалена
      summary: Выход
      tags:
      - auth
  /auth/me:
    get:
      description: Возвращает профиль владельца cookie `access_token`. Удобно для
        проверки, что вход прошёл.
      produces:
      - application/json
      responses:
        "200":
          description: Профиль и роль текущего пользователя
          schema:
            $ref: '#/definitions/dto.AuthenticatedUserResponse'
        "401":
          description: Нет или истекла cookie access_token
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
      security:
      - CookieAuth: []
      summary: Текущий пользователь
      tags:
      - auth
  /categories:
    get:
      description: Справочник для полей `category` и `wants`. Слаг — стабильный ключ,
