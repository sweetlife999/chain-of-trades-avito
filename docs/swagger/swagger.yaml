basePath: /
definitions:
  dto.BlockedUserResponse:
    properties:
      blocked_at:
        type: string
      id:
        type: string
      nickname:
        type: string
      photo_url:
        type: string
    type: object
  dto.CreateItemRequest:
    properties:
      category:
        example: bikes
        type: string
      description:
        example: Почти новый, катался год
        type: string
      photo_urls:
        example:
        - https://example.com/bike-1.jpg
        - https://example.com/bike-2.jpg
        items:
          type: string
        type: array
      title:
        example: Велосипед
        type: string
      wants:
        example:
        - consoles
        - phones
        items:
          type: string
        type: array
    type: object
  dto.CreateMessageRequest:
    properties:
      body:
        example: Могу привезти в субботу к метро, удобно?
        type: string
    type: object
  dto.CreateUserRequest:
    properties:
      description:
        type: string
      nickname:
        type: string
      password:
        type: string
      photo_url:
        type: string
    type: object
  dto.ExchangeResponse:
    properties:
      closed_at:
        type: string
      created_at:
        type: string
      id:
        type: string
      participants:
        items:
          $ref: '#/definitions/dto.ParticipantResponse'
        type: array
      status:
        type: string
      unread_count:
        type: integer
      updated_at:
        type: string
    type: object
  dto.ItemError:
    properties:
      error:
        type: string
    type: object
  dto.ItemResponse:
    properties:
      category:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      owner_id:
        type: string
      photo_urls:
        items:
          type: string
        type: array
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
      wants:
        items:
          type: string
        type: array
    type: object
  dto.LoginRequest:
    properties:
      nickname:
        type: string
      password:
        type: string
    type: object
  dto.MessageResponse:
    properties:
      author:
        $ref: '#/definitions/dto.ParticipantUserResponse'
      body:
        type: string
      created_at:
        type: string
      id:
        type: string
      kind:
        type: string
    type: object
  dto.ParticipantItemResponse:
    properties:
      category:
        $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.CategoryResponse'
      description:
        type: string
      id:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  dto.ParticipantResponse:
    properties:
      completion_confirmed_at:
        type: string
      decided_at:
        type: string
      gives_item:
        $ref: '#/definitions/dto.ParticipantItemResponse'
      position:
        type: integer
      receives_item:
        $ref: '#/definitions/dto.ParticipantItemResponse'
      status:
        type: string
      user:
        $ref: '#/definitions/dto.ParticipantUserResponse'
    type: object
  dto.ParticipantUserResponse:
    properties:
      id:
        type: string
      nickname:
        type: string
      photo_url:
        type: string
    type: object
  dto.UpdateItemRequest:
    properties:
      category:
        example: bikes
        type: string
      description:
        example: Добавил фото рамы
        type: string
      photo_urls:
        example:
        - https://example.com/bike-1.jpg
        - https://example.com/bike-3.jpg
        items:
          type: string
        type: array
      title:
        example: Велосипед городской
        type: string
      wants:
        example:
        - consoles
        items:
          type: string
        type: array
    type: object
  dto.UpdateUserRequest:
    properties:
      description:
        type: string
      nickname:
        type: string
      photo_url:
        type: string
    type: object
  dto.UserResponse:
    properties:
      created_at:
        type: string
      deals_broken:
        type: integer
      deals_completed:
        type: integer
      description:
        type: string
      id:
        type: string
      nickname:
        type: string
      photo_url:
        type: string
      rating:
        type: number
      updated_at:
        type: string
    type: object
  github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.CategoryResponse:
    properties:
      name:
        type: string
      slug:
        type: string
    type: object
  github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  github_com_sweetlife999_chain-of-trades-avito_internal_item_dto.CategoryResponse:
    properties:
      name:
        example: Велосипеды и транспорт
        type: string
      slug:
        example: bikes
        type: string
    type: object
  github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse:
    properties:
      error:
        type: string
    type: object
info:
  contact: {}
  description: |-
    HTTP API сервиса многостороннего обмена вещами: профили пользователей, вход по JWT
    и объявления о вещах, которые владелец готов обменять.

    Защищённые маршруты читают HttpOnly cookie `access_token`. Кнопки «Authorize» здесь нет
    и не нужно: выполните `POST /auth/login` прямо из этой страницы — браузер сохранит cookie
    и будет отправлять её со всеми следующими запросами сам.
  title: Цепочка обмена — API
  version: 0.1.0
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Проверяет nickname и password, кладёт JWT на 12 часов в HttpOnly
        cookie `access_token`. Из Swagger UI cookie сохранится в браузере, дальше
        защищённые запросы уйдут с ней автоматически.
      parameters:
      - description: Учётные данные
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Вошедший пользователь, cookie в заголовке Set-Cookie
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "400":
          description: Некорректное тело запроса
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
        "401":
          description: Неверный nickname или пароль
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
      summary: Вход
      tags:
      - auth
  /auth/logout:
    post:
      description: Удаляет cookie `access_token`. Сам JWT остаётся валидным до истечения
        срока — серверного списка отзыва нет.
      responses:
        "204":
          description: Cookie удалена
      summary: Выход
      tags:
      - auth
  /auth/me:
    get:
      description: Возвращает профиль владельца cookie `access_token`. Удобно для
        проверки, что вход прошёл.
      produces:
      - application/json
      responses:
        "200":
          description: Профиль текущего пользователя
          schema:
            $ref: '#/definitions/dto.UserResponse'
        "401":
          description: Нет или истекла cookie access_token
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_user_dto.ErrorResponse'
      summary: Текущий пользователь
      tags:
      - auth
  /categories:
    get:
      description: Справочник для полей `category` и `wants`. Слаг — стабильный ключ,
        название меняется, слаг нет.
      produces:
      - application/json
      responses:
        "200":
          description: Категории
          schema:
            items:
              $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_item_dto.CategoryResponse'
            type: array
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.ItemError'
      summary: Список категорий
      tags:
      - items
  /exchanges:
    get:
      description: Возвращает все найденные обмены текущего пользователя вместе с
        участниками и объявлениями.
      produces:
      - application/json
      responses:
        "200":
          description: Список обменов; если обменов нет, возвращается []
          schema:
            items:
              $ref: '#/definitions/dto.ExchangeResponse'
            type: array
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
      summary: Получить свои обмены
      tags:
      - exchanges
  /exchanges/{id}:
    get:
      description: Доступен только участнику этого обмена.
      parameters:
      - description: UUID обмена
        example: 8db9f3e2-8a45-4a70-b3d1-167b4f97e121
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Обмен
          schema:
            $ref: '#/definitions/dto.ExchangeResponse'
        "400":
          description: ID не является UUID
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "403":
          description: Пользователь не участвует в обмене
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "404":
          description: Обмен не найден
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
      summary: Получить обмен по ID
      tags:
      - exchanges
  /exchanges/{id}/complete:
    post:
      description: Сохраняет подтверждение текущего участника. После подтверждения
        всеми участниками обмен завершается, объявления помечаются переданными, а
        счётчики завершённых обменов увеличиваются.
      parameters:
      - description: UUID обмена
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Получение подтверждено
        "400":
          description: ID не является UUID
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "403":
          description: Пользователь не участвует в обмене
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "404":
          description: Обмен не найден
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "409":
          description: Обмен ещё не подтверждён или уже отменён
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
      summary: Подтвердить получение вещи
      tags:
      - exchanges
  /exchanges/{id}/confirm:
    post:
      description: Сохраняет согласие текущего участника. После согласия всех участников
        обмен подтверждается, а объявления резервируются.
      parameters:
      - description: UUID обмена
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Участие подтверждено
        "400":
          description: ID не является UUID
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "403":
          description: Пользователь не участвует в обмене
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "404":
          description: Обмен не найден
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "409":
          description: Решение уже принято, обмен закрыт или объявление недоступно
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
      summary: Подтвердить участие в обмене
      tags:
      - exchanges
  /exchanges/{id}/decline:
    post:
      description: Отменяет предложенный или подтверждённый обмен. Для подтверждённого
        обмена освобождает объявления, увеличивает счётчик сорванных обменов отказавшегося
        пользователя и запускает поиск новых вариантов.
      parameters:
      - description: UUID обмена
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Обмен отменён, доступные объявления возвращены в поиск
        "400":
          description: ID не является UUID
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "403":
          description: Пользователь не участвует в обмене
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "404":
          description: Обмен не найден
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "409":
          description: Обмен уже закрыт, объявление недоступно или получение уже подтверждено
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
      summary: Отказаться от участия в обмене
      tags:
      - exchanges
  /exchanges/{id}/messages:
    get:
      description: Возвращает обсуждение и события обмена одной лентой в хронологическом
        порядке. Доступен только участнику.
      parameters:
      - description: UUID обмена
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Тред; если сообщений нет, возвращается []
          schema:
            items:
              $ref: '#/definitions/dto.MessageResponse'
            type: array
        "400":
          description: ID не является UUID
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "403":
          description: Пользователь не участвует в обмене
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "404":
          description: Обмен не найден
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
      summary: Прочитать тред обмена
      tags:
      - exchanges
    post:
      consumes:
      - application/json
      description: Добавляет сообщение участника в обсуждение обмена. Писать могут
        только участники и только пока обмен не закрыт.
      parameters:
      - description: UUID обмена
        in: path
        name: id
        required: true
        type: string
      - description: Текст сообщения
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/dto.CreateMessageRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Сообщение добавлено
          schema:
            $ref: '#/definitions/dto.MessageResponse'
        "400":
          description: ID не является UUID или текст пустой либо длиннее 2000 символов
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "401":
          description: Пользователь не авторизован
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "403":
          description: Пользователь не участвует в обмене
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "404":
          description: Обмен не найден
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "409":
          description: 'Обмен закрыт: тред доступен только на чтение'
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/github_com_sweetlife999_chain-of-trades-avito_internal_exchange_dto.ErrorResponse'
      summary: Написать в тред обмена
      tags:
      - exchanges
  /health:
    get:
      description: Отвечает 200, если процесс поднят. Состояние БД не проверяет.
      produces:
      - application/json
      responses:
        "200":
          description: сервис работает
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Проверка живости сервиса
      tags:
      - system
  /items:
    get:
      description: |-
        Требует cookie `access_token`. Возвращает все объявления текущего пользователя
        любого статуса, от новых к старым. Чужие объявления этим маршрутом не отдаются.
      produces:
      - application/json
      responses:
        "200":
          description: Список объявлений; если их нет, возвращается []
          schema:
            items:
              $ref: '#/definitions/dto.ItemResponse'
            type: array
        "401":
          description: Нет или истекла cookie access_token
          schema:
            $ref: '#/definitions/dto.ItemError'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.ItemError'
      summary: Получить свои объявления
      tags:
      - items
    post:
      consumes:
      - application/json
      description: |-
        Требует cookie `access_token`. Владелец берётся из токена, а не из тела запроса.
        Нужна хотя бы одна фотография (ссылкой) и хотя бы одна желаемая категория —
        без них объявление не участвует в подборе обменов. Список категорий: GET /categories.
      parameters:
      - description: Данные объявления
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateItemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Создано, ссылка на объявление в заголовке Location
          schema:
            $ref: '#/definitions/dto.ItemResponse'
        "400":
          description: Некорректное тело запроса, нет фото или желаний, неизвестная
            категория
          schema:
            $ref: '#/definitions/dto.ItemError'
        "401":
          description: Нет или истекла cookie access_token
          schema:
            $ref: '#/definitions/dto.ItemError'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.ItemError'
      summary: Создать объявление
      tags:
      - items
  /items/{id}:
    delete:
      description: |-
        Требует cookie `access_token`, удалять можно только свои объявления. Вещь, уже занятую
        в незавершённом обмене, удалить нельзя: иначе участник остался бы без обещанного предмета.
      parameters:
      - description: UUID объявления
        example: 8db9f3e2-8a45-4a70-b3d1-167b4f97e121
        in: path
        name: id
