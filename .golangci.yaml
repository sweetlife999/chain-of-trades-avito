version: "2"

run:
  # Иначе интеграционные тесты (//go:build integration) остаются непроверенными.
  build-tags:
    - integration

linters:
  # standard = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    # В сервисах всюду обёртки через %w: ловит сравнение таких ошибок мимо errors.Is/As.
    - errorlint
    # Незакрытые resp.Body в http-клиентах и тестах.
    - bodyclose
    # JWT, bcrypt и SQL-строки: проверки на auth-путях.
    - gosec
  settings:
    gosec:
      excludes:
        # Taint-анализ ругается на log.Fatalf в cmd/migrate: аргумент — собственный
        # argv CLI, а не пользовательский ввод. Модели угроз тут нет.
        - G706
  exclusions:
    # lax, а не strict: у docs/swagger/docs.go маркер без точки в конце,
    # strict его не признаёт сгенерированным и линтит cгенерённый код.
    generated: lax
    presets:
      # Не ругаться на defer x.Close() и прочую классику.
      - std-error-handling
    rules:
      # В тестах gosec видит "пароли" в фикстурах и небезопасные куки в запросах,
      # которые клиент и не должен помечать HttpOnly.
      - path: _test\.go
        linters:
          - gosec
      # G304 в загрузке файлов: путь склеен из каталога конфигурации и uuid, который
      # сгенерировал сам сервис. Имя файла от клиента не участвует вовсе — брать его
      # оттуда и было бы дырой, поэтому мы его отбрасываем.
      - path: internal/upload/service/service\.go
        text: G304
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sweetlife999/chain-of-trades-avito
