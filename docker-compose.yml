# pull_policy: build у всех трёх собираемых сервисов — чтобы обычный `docker compose up`
# пересобирал образ, а не поднимал прошлый local-тег. Без этого правка в Go или в
# Caddyfile не доезжает до контейнера, пока кто-нибудь не вспомнит про --build.
# Прод собирать не должен: там образы из GHCR, оверлей возвращает политику по умолчанию.

# Один DSN на migrate и api: разъедутся — окажутся на разных базах.
x-database-url: &database-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Только с localhost: psql и make run ходят с той же машины, а наружу база
    # смотреть не должна — ни в разработке, ни на сервере.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Одноразовый накат: тот же образ, что у api, только другая команда.
  # Второй build — попадание в кеш, поэтому дублирование ничего не стоит.
  migrate:
    build: .
    image: chain-of-trades:local
    pull_policy: build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: *database-url
    command: ["migrate", "up"]

  # Порт наружу не публикуется: в api ходит только Caddy внутри сети, а :8080 на
  # хосте остаётся свободным для make run.
  api:
    build: .
    image: chain-of-trades:local
    pull_policy: build
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      HTTP_ADDR: ":8080"
      UPLOADS_DIR: /data/uploads
      # В .env адрес указывает на localhost ради `make run` с хоста, поэтому внутри
      # compose он переопределяется — как и DATABASE_URL выше.
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
    volumes:
      # Фотографии объявлений и аватарки. Том монтируется только сюда: раздаёт файлы сам
      # api, поэтому Caddy к ним не ходит. Переживает деплой ровно как pgdata — cd.yml
      # гасит стек через down без -v.
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: ./frontend
    image: chain-of-trades-web:local
    pull_policy: build
    depends_on:
      api:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${WEB_PORT:-80}:80"
      - "${WEB_TLS_PORT:-443}:443"
    volumes:
      # Сертификаты Let's Encrypt переживают пересоздание контейнера.
      - caddy_data:/data
    restart: unless-stopped

  # Локальная модель. В зависимостях api её нет намеренно: фичи поверх модели ещё не
  # написаны, а когда появятся — сайт всё равно обязан подниматься, пока веса качаются.
  ollama:
    image: ollama/ollama
    # Только с localhost, ровно как у postgres: нужен `make run` с хоста, а наружу
    # незащищённый инференс смотреть не должен.
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      # Веса переживают пересоздание контейнера: качать 400 МБ на каждый деплой незачем.
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Одноразовое скачивание весов: тот же образ, другая команда — приём тот же, что у
  # migrate. Том не монтируется: качает сервер по OLLAMA_HOST, а не этот CLI.
  ollama-pull:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen2.5:0.5b}"]

volumes:
  pgdata:
  caddy_data:
  uploads:
  ollama:
