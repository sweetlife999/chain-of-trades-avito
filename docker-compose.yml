# Один DSN на migrate и api: разъедутся — окажутся на разных базах.
x-database-url: &database-url postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Только с localhost: psql и make run ходят с той же машины, а наружу база
    # смотреть не должна — ни в разработке, ни на сервере.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Одноразовый накат: тот же образ, что у api, только другая команда.
  # Второй build — попадание в кеш, поэтому дублирование ничего не стоит.
  migrate:
    build: .
    image: chain-of-trades:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: *database-url
    command: ["migrate", "up"]

  # Порт наружу не публикуется: в api ходит только Caddy внутри сети, а :8080 на
  # хосте остаётся свободным для make run.
  api:
    build: .
    image: chain-of-trades:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      HTTP_ADDR: ":8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: ./frontend
    image: chain-of-trades-web:local
    depends_on:
      api:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${WEB_PORT:-80}:80"
      - "${WEB_TLS_PORT:-443}:443"
    volumes:
      # Сертификаты Let's Encrypt переживают пересоздание контейнера.
      - caddy_data:/data
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
